name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Create App Bundle Structure
        run: |
          mkdir -p build/MiApp.app
          mkdir -p build/MiApp.app/META-INF

      - name: Compile Source
        run: |
          # Compile all .m files into a single binary
          clang \
            -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -miphoneos-version-min=14.0 \
            -o build/MiApp.app/MiApp \
            MiApp/main.m \
            MiApp/AppDelegate.m \
            MiApp/ViewController.m \
            MiApp/KeyViewController.m \
            2>&1

      - name: Create Info.plist
        run: |
          cp MiApp/Info.plist build/MiApp.app/Info.plist

      - name: Copy Assets
        run: |
          cp -r MiApp/Assets.xcassets build/MiApp.app/Assets.car 2>/dev/null || true
          # Create a minimal Assets.car placeholder
          touch build/MiApp.app/Assets.car

      - name: Create PkgInfo
        run: echo -n "APPL????" > build/MiApp.app/PkgInfo

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/MiApp.app build/ipa/Payload/
          cd build/ipa
          zip -r ../MiApp.ipa Payload/
          cd ../..
          echo "=== IPA Created ==="
          ls -lh build/MiApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-IPA
          path: build/MiApp.ipa
          retention-days: 30
