name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Show Project Info
        run: |
          echo "=== Project files ==="
          ls -la *.xcodeproj
          echo ""
          echo "=== Build settings ==="
          xcodebuild -project MiApp.xcodeproj -scheme MiApp -showBuildSettings 2>/dev/null | grep -E "BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR|WRAPPER_EXTENSION" || true
          echo ""
          echo "=== Schemes ==="
          xcodebuild -project MiApp.xcodeproj -list 2>/dev/null || true

      - name: Build App
        run: |
          set -e
          xcodebuild build \
            -project MiApp.xcodeproj \
            -scheme MiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM="" \
            | tail -30
          
          echo "=== Searching for .app ==="
          find build/derivedData -name "*.app" -type d 2>/dev/null
          find build/derivedData -name "*.app" -type d -exec ls -la {} \; 2>/dev/null || echo "No .app found in derivedData"
          
          # Also check Build/Products
          find build/ -name "*.app" -type d 2>/dev/null || echo "No .app in build/"
          
          APP_PATH=$(find build/derivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app bundle"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" > build/app_path.txt
          echo "Found app: $APP_PATH"

      - name: Create IPA
        run: |
          set -e
          APP_PATH=$(cat build/app_path.txt | cut -d= -f2)
          echo "Using app at: $APP_PATH"
          
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          
          echo "=== Payload contents ==="
          ls -la build/ipa/Payload/
          
          cd build/ipa
          zip -r ../MiApp.ipa Payload/
          cd ../..
          ls -la build/MiApp.ipa
          echo "IPA created successfully!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-IPA
          path: build/MiApp.ipa
          retention-days: 30
