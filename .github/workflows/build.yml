name: Compilar Mi App con Motor Filza
on: [push, pull_request, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-latest

    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Verificar recuperación y reemplazo del túnel
        run: |
          python3 XitForge-Tunnel/tools/test_native_worker.py
          python3 XitForge-Tunnel/tools/test_sync_retry.py
          python3 XitForge-Tunnel/tools/test_recovery.py
          python3 XitForge-Tunnel/tools/test_creation_probe.py
          python3 XitForge-Tunnel/tools/test_books_recovery.py
          python3 XitForge-Tunnel/tools/test_known_write.py
          python3 XitForge-Tunnel/tools/test_legacy_books.py

      - name: Instalar dependencias base
        run: |
          brew install xcodegen ldid dpkg make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Compilar e instalar insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          clang insert_dylib/main.c -o insert_dylib_tool
          sudo cp insert_dylib_tool /usr/local/bin/insert_dylib
          sudo chmod +x /usr/local/bin/insert_dylib
          cd ..

      - name: Generar proyecto Xcode con XcodeGen
        run: xcodegen generate

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza
          cd motor_filza
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean
          make package FINALPACKAGE=1
          cd ..

      - name: Compilar Mi App
        run: |
          xcodebuild clean build \
            -project MiApp.xcodeproj \
            -scheme MiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar Mi App con el motor
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "MiApp.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró MiApp.app"
            exit 1
          fi

          echo "App encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          DYLIB_PATH=$(find motor_filza -name "FilzaApplySandboxExt.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            DYLIB_PATH=$(find motor_filza/.theos -name "*.dylib" | head -n 1)
          fi

          if [ -z "$DYLIB_PATH" ]; then
            echo "ERROR: No se encontró la dylib del motor"
            exit 1
          fi

          DYLIB_NAME=$(basename "$DYLIB_PATH")
          echo "Motor encontrado: $DYLIB_NAME"
          cp "$DYLIB_PATH" Payload/MiApp.app/

          insert_dylib --strip-codesig --all-yes \
            "@executable_path/$DYLIB_NAME" \
            Payload/MiApp.app/MiApp \
            Payload/MiApp.app/MiApp_patched

          mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp

          echo "=== Contenido del bundle ==="
          ls -la Payload/MiApp.app/

          echo "=== Load commands del binario ==="
          otool -L Payload/MiApp.app/MiApp

          FECHA=$(date +%Y%m%d_%H%M%S)
          zip -qr MiApp_${FECHA}.ipa Payload/
          echo "IPA base generada: MiApp_${FECHA}.ipa"

      - name: Comprobar archivos del túnel
        run: |
          test -f XitForge-Tunnel/module/XFAirLiftProfessionalUI.m
          test -f XitForge-Tunnel/module/build-module.sh
          test -f XitForge-Tunnel/module/package_ipa.py
          test -f XitForge-Tunnel/prebuilt/libidevice_ffi.a
          echo "Archivos del túnel encontrados correctamente"

      - name: Compilar módulo XitForge actualizado
        run: |
          bash XitForge-Tunnel/module/build-module.sh

          test -f XitForge-Tunnel/module/build/XFAirLift.dylib

          # Correcto para Xcode 26.x: archivo primero, operación después.
          xcrun lipo XitForge-Tunnel/module/build/XFAirLift.dylib -verify_arch arm64

          echo "=== Dependencias del módulo actualizado ==="
          otool -L XitForge-Tunnel/module/build/XFAirLift.dylib

          echo "=== SHA256 del módulo actualizado ==="
          shasum -a 256 XitForge-Tunnel/module/build/XFAirLift.dylib

      - name: Integrar módulo XitForge 1.5.0-atc-write
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          base = list(Path('.').glob('MiApp_*.ipa'))
          if len(base) != 1:
              raise SystemExit(
                  f'Se esperaba exactamente una IPA base de esta compilación y se encontraron {len(base)}'
              )

          module = Path('XitForge-Tunnel/module/build/XFAirLift.dylib')
          if not module.is_file():
              raise SystemExit('No existe la dylib actualizada del túnel')

          subprocess.run([
              sys.executable,
              'XitForge-Tunnel/module/package_ipa.py',
              str(base[0]),
              str(module),
              'XitForge-1.5.0-atc-write-unsigned.ipa',
              'XitForge-Tunnel/module/Notices.txt'
          ], check=True)
          PY

      - name: Verificar IPA final
        run: |
          test -f XitForge-1.5.0-atc-write-unsigned.ipa
          test -f XitForge-1.5.0-atc-write-unsigned.validation.json

          unzip -t XitForge-1.5.0-atc-write-unsigned.ipa
          echo "IPA final creada correctamente"

      - name: Subir IPA final
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-XitForge-1.5.0-atc-write
          path: |
            XitForge-1.5.0-atc-write-unsigned.ipa
            XitForge-1.5.0-atc-write-unsigned.validation.json
          if-no-files-found: error
