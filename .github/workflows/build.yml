name: Build iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iOS Project
      run: |
        xcodebuild -project MiApp/MiApp.xcodeproj \
                   -scheme MiApp \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   build
