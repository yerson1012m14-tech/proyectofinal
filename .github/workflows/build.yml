name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Instalar dependencias
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen ldid dpkg make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Compilar e instalar insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          clang insert_dylib/main.c -o insert_dylib_tool
          sudo cp insert_dylib_tool /usr/local/bin/insert_dylib
          sudo chmod +x /usr/local/bin/insert_dylib
          cd ..

      - name: Generar proyecto Xcode con XcodeGen
        run: |
          xcodegen generate
          # Auto-create shared scheme
          mkdir -p MiApp.xcodeproj/xcshareddata/xcschemes
          cat > MiApp.xcodeproj/xcshareddata/xcschemes/MiApp.xcscheme << 'SCHEME'
<?xml version="1.0" encoding="UTF-8"?>
<Scheme
   LastUpgradeVersion = "1540"
   version = "1.7">
   <BuildAction
      parallelizeBuildables = "YES"
      buildImplicitDependencies = "YES">
      <BuildActionEntries>
         <BuildActionEntry
            buildForTesting = "YES"
            buildForRunning = "YES"
            buildForProfiling = "YES"
            buildForArchiving = "YES"
            buildForAnalyzing = "YES">
            <BuildableReference
               BuildableIdentifier = "primary"
               BlueprintIdentifier = "PBXNativeTarget MiApp"
               BuildableName = "MiApp.app"
               BlueprintName = "MiApp"
               ReferencedContainer = "container:MiApp.xcodeproj">
            </BuildableReference>
         </BuildActionEntry>
      </BuildActionEntries>
   </BuildAction>
</Scheme>
SCHEME
          echo "=== Schemes ==="
          ls -la MiApp.xcodeproj/xcshareddata/xcschemes/
          xcodebuild -project MiApp.xcodeproj -list 2>&1

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza || true
          cd motor_filza || exit 0
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean || true
          make package FINALPACKAGE=1 || make || true
          cd ..
          echo "=== Dylibs ==="
          find motor_filza -name "*.dylib" -type f 2>/dev/null || echo "Ninguno"

      - name: Compilar Mi App
        run: |
          xcodebuild clean archive \
            -project MiApp.xcodeproj \
            -scheme MiApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MiApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO

      - name: Empaquetar Mi App con el motor
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/MiApp.xcarchive -name "MiApp.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Buscando cualquier .app..."
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "App: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          DYLIB_PATH=$(find motor_filza -name "*.dylib" -type f 2>/dev/null | head -n 1)
          if [ -n "$DYLIB_PATH" ]; then
            echo "Motor: $DYLIB_PATH"
            cp "$DYLIB_PATH" Payload/MiApp.app/
            DYLIB_NAME=$(basename "$DYLIB_PATH")
            insert_dylib --strip-codesig --all-yes "@executable_path/$DYLIB_NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched
            mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp
            chmod +x Payload/MiApp.app/MiApp
          fi
          
          echo "=== Bundle ==="
          ls -la Payload/MiApp.app/
          rm -f MiApp.ipa
          zip -r MiApp.ipa Payload/
          ls -lh MiApp.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp.ipa
