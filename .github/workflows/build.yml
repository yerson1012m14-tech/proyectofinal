name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Instalar dependencias
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
          git clone --recursive https://github.com/theos/theos.git $HOME/theos 2>/dev/null || true
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Clonar motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza 2>/dev/null || true
          cd motor_filza 2>/dev/null && export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) && export TARGET=iphone:clang:latest:18.0 && make clean 2>/dev/null; make package FINALPACKAGE=1 2>/dev/null || make 2>/dev/null || true; cd .. 2>/dev/null || true
          echo "Dylibs:" && find motor_filza -name "*.dylib" -type f 2>/dev/null || echo "Ninguno"

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Ver scheme generado
        run: |
          echo "=== xcodeproj contents ==="
          find xitfarge.xcodeproj -name "*.xcscheme" 2>/dev/null || echo "No schemes found"
          find xitfarge.xcodeproj -name "project.pbxproj" -exec grep -c "buildConfigurationList" {} \; 2>/dev/null
          echo "=== Available schemes ==="
          xcodebuild -project xitfarge.xcodeproj -list 2>&1 || true

      - name: Compilar con xcodebuild
        run: |
          xcodebuild clean archive \
            -project xitfarge.xcodeproj \
            -scheme xitfarge \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/xitfarge.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO

      - name: Crear IPA
        run: |
          mkdir -p Payload
          APP=$(find build/xitfarge.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "App: $APP"
          cp -r "$APP" Payload/
          
          # Intentar motor
          DYLIB=$(find motor_filza -name "*.dylib" -type f 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            echo "Motor: $DYLIB"
            cp "$DYLIB" Payload/*.app/
            git clone https://github.com/Tyilo/insert_dylib.git 2>/dev/null || true
            if [ -d insert_dylib ]; then
              clang insert_dylib/main.c -o insert_dylib_tool 2>/dev/null
              NAME=$(basename "$DYLIB")
              ./insert_dylib_tool --strip-codesig --all-yes "@executable_path/$NAME" Payload/*.app/MiApp Payload/*.app/MiApp_patched 2>/dev/null && mv Payload/*.app/MiApp_patched Payload/*.app/MiApp 2>/dev/null && chmod +x Payload/*.app/MiApp 2>/dev/null || true
            fi
          fi
          
          ls -la Payload/
          rm -f MiApp.ipa
          zip -r MiApp.ipa Payload/
          ls -lh MiApp.ipa
          unzip -l MiApp.ipa | head -15

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp.ipa
