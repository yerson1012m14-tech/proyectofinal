name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          brew install theos 2>/dev/null || true
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          git clone --recursive https://github.com/theos/theos.git $HOME/theos || true
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza || true
          cd motor_filza
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean || true
          make package FINALPACKAGE=1 || make || true
          cd ..
          echo "=== Dylibs ==="
          find motor_filza -name "*.dylib" -type f 2>/dev/null || echo "Ninguno"

      - name: Compilar Mi App
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -miphoneos-version-min=14.0 \
            -o MiApp_bin \
            MiApp/main.m \
            MiApp/AppDelegate.m \
            MiApp/ViewController.m \
            MiApp/KeyViewController.m

      - name: Crear IPA
        run: |
          mkdir -p Payload/MiApp.app
          cp MiApp_bin Payload/MiApp.app/MiApp
          chmod +x Payload/MiApp.app/MiApp
          cp MiApp/Info.plist Payload/MiApp.app/
          echo -n "APPL????" > Payload/MiApp.app/PkgInfo
          
          # Intentar inyectar motor
          DYLIB=$(find motor_filza -name "*.dylib" -type f 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            echo "Motor: $DYLIB"
            cp "$DYLIB" Payload/MiApp.app/
            if [ ! -f insert_dylib_tool ]; then
              git clone https://github.com/Tyilo/insert_dylib.git 2>/dev/null || true
              if [ -d insert_dylib ]; then
                clang insert_dylib/main.c -o insert_dylib_tool 2>/dev/null || true
              fi
            fi
            if [ -f insert_dylib_tool ]; then
              NAME=$(basename "$DYLIB")
              ./insert_dylib_tool --strip-codesig --all-yes "@executable_path/$NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched 2>/dev/null
              if [ -f Payload/MiApp.app/MiApp_patched ]; then
                mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp
                chmod +x Payload/MiApp.app/MiApp
              fi
            fi
          fi
          
          echo "=== Firma ad-hoc ==="
          codesign --force --deep --sign - Payload/MiApp.app || true
          
          echo "=== Contenido del bundle ==="
          ls -la Payload/MiApp.app/
          
          # Crear IPA con la estructura correcta (Payload/ en la raiz del zip)
          rm -f MiApp.ipa
          zip -r MiApp.ipa Payload/
          ls -lh MiApp.ipa
          echo "=== Estructura IPA ==="
          unzip -l MiApp.ipa | head -10

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp.ipa
