name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Instalar dependencias base
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen ldid dpkg make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Compilar e instalar insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          clang insert_dylib/main.c -o insert_dylib_tool
          sudo cp insert_dylib_tool /usr/local/bin/insert_dylib
          sudo chmod +x /usr/local/bin/insert_dylib
          cd ..

      - name: Generar proyecto Xcode con XcodeGen
        run: xcodegen generate

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza
          cd motor_filza
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean || true
          make package FINALPACKAGE=1 || make || true
          cd ..
          echo "=== Dylibs ==="
          find motor_filza -name "*.dylib" -type f 2>/dev/null || echo "Ninguno"

      - name: Compilar Mi App
        run: |
          xcodebuild clean build \
            -project MiApp.xcodeproj \
            -target MiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Crear IPA
        run: |
          mkdir -p Payload
          APP=$(find build -name "MiApp.app" -type d | head -1)
          echo "App: $APP"
          cp -r "$APP" Payload/
          
          DYLIB=$(find motor_filza -name "*.dylib" -type f 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            echo "Motor: $DYLIB"
            cp "$DYLIB" Payload/MiApp.app/
            NAME=$(basename "$DYLIB")
            insert_dylib --strip-codesig --all-yes "@executable_path/$NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched || true
            mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp 2>/dev/null || true
            chmod +x Payload/MiApp.app/MiApp 2>/dev/null || true
          fi
          
          ls -la Payload/MiApp.app/
          zip -r MiApp.ipa Payload/

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp.ipa
