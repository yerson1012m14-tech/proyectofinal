name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build App
        run: |
          xcodebuild build \
            -project MiApp.xcodeproj \
            -target MiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log || true
          
          echo "=== Build log tail ==="
          tail -30 build.log
          
          echo ""
          echo "=== Searching for .app ==="
          find build/DerivedData -name "*.app" -type d 2>/dev/null || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            echo "=== Build directory tree ==="
            find build/ -maxdepth 5 -type d 2>/dev/null
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../MiApp.ipa Payload/
          cd ../..
          echo "=== IPA created ==="
          ls -lh build/MiApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-IPA
          path: build/MiApp.ipa
          retention-days: 30
