name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Instalar dependencias base
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen ldid dpkg make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Compilar e instalar insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cd insert_dylib
          clang insert_dylib/main.c -o insert_dylib_tool
          sudo cp insert_dylib_tool /usr/local/bin/insert_dylib
          sudo chmod +x /usr/local/bin/insert_dylib
          cd ..

      - name: Generar proyecto Xcode con XcodeGen
        run: xcodegen generate

      - name: Clonar y compilar el motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza
          cd motor_filza
          export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export TARGET=iphone:clang:latest:18.0
          make clean || true
          make package FINALPACKAGE=1 || make
          cd ..
          echo "=== Dylibs encontrados ==="
          find motor_filza -name "*.dylib" -type f 2>/dev/null || echo "Ninguno"

      - name: Compilar Mi App
        run: |
          xcodebuild clean build \
            -project MiApp.xcodeproj \
            -target MiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar Mi App con el motor
        run: |
          set -e
          mkdir -p Payload
          
          # Buscar el .app
          APP_PATH=$(find build -name "MiApp.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "=== ERROR: No se encontro MiApp.app ==="
            echo "=== Contenido de build/ ==="
            find build/ -maxdepth 4 -type d 2>/dev/null
            exit 1
          fi
          echo "App: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Buscar el dylib del motor
          DYLIB_PATH=""
          for name in FilzaApplySandboxExt.dylib FilzaSlop.dylib; do
            DYLIB_PATH=$(find motor_filza -name "$name" -type f 2>/dev/null | head -n 1)
            if [ -n "$DYLIB_PATH" ]; then break; fi
          done
          if [ -z "$DYLIB_PATH" ]; then
            DYLIB_PATH=$(find motor_filza -name "*.dylib" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$DYLIB_PATH" ]; then
            echo "=== ERROR: No se encontro dylib del motor ==="
            echo "=== Contenido de motor_filza/ ==="
            find motor_filza/ -maxdepth 3 -type f -name "*.dylib" -o -name "*.a" 2>/dev/null
            exit 1
          fi
          
          DYLIB_NAME=$(basename "$DYLIB_PATH")
          echo "Motor: $DYLIB_NAME"
          cp "$DYLIB_PATH" Payload/MiApp.app/
          
          # Inyectar
          insert_dylib --strip-codesig --all-yes "@executable_path/$DYLIB_NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched
          mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp
          chmod +x Payload/MiApp.app/MiApp
          
          echo "=== Bundle contents ==="
          ls -la Payload/MiApp.app/
          
          # Crear IPA
          FECHA=$(date +%Y%m%d_%H%M%S)
          zip -qr MiApp_${FECHA}.ipa Payload/
          echo "IPA: MiApp_${FECHA}.ipa"
          ls -lh MiApp_${FECHA}.ipa

      - name: Subir IPA final
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp_*.ipa
