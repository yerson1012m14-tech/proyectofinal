name: Compilar Mi App con Motor Filza
on: [push, workflow_dispatch]

jobs:
  build-my-app:
    runs-on: macos-14
    steps:
      - name: Clonar mi app
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Instalar dependencias
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install ldid

      - name: Clonar motor FilzaSlop
        run: |
          git clone --recursive https://github.com/0xjohnnydev/FilzaSlop.git motor_filza 2>/dev/null || true
          if [ -d motor_filza ]; then
            cd motor_filza
            export SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
            export TARGET=iphone:clang:latest:18.0
            make clean 2>/dev/null || true
            make package FINALPACKAGE=1 2>/dev/null || make 2>/dev/null || true
            cd ..
          fi
          echo "Dylibs:" && find motor_filza -name "*.dylib" -type f 2>/dev/null || echo "Ninguno"

      - name: Compilar Mi App
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -fmodules \
            -framework UIKit \
            -framework Foundation \
            -miphoneos-version-min=14.0 \
            -o MiApp_bin \
            MiApp/main.m \
            MiApp/AppDelegate.m \
            MiApp/ViewController.m \
            MiApp/KeyViewController.m

      - name: Empaquetar y firmar IPA
        run: |
          # Crear bundle
          rm -rf Payload MiApp.ipa
          mkdir -p Payload/MiApp.app
          cp MiApp_bin Payload/MiApp.app/MiApp
          chmod +x Payload/MiApp.app/MiApp
          cp MiApp/Info.plist Payload/MiApp.app/
          # Resolver variables del Info.plist
          sed -i '' 's/$(EXECUTABLE_NAME)/MiApp/g' Payload/MiApp.app/Info.plist
          sed -i '' 's/$(PRODUCT_BUNDLE_IDENTIFIER)/com.xitfarge.app/g' Payload/MiApp.app/Info.plist
          sed -i '' 's/$(PRODUCT_NAME)/xitfarge/g' Payload/MiApp.app/Info.plist
          echo -n "APPL????" > Payload/MiApp.app/PkgInfo
          
          # Inyectar motor si existe
          DYLIB=$(find motor_filza -name "*.dylib" -type f 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            echo "Motor: $DYLIB"
            cp "$DYLIB" Payload/MiApp.app/
            git clone https://github.com/Tyilo/insert_dylib.git 2>/dev/null
            if [ -d insert_dylib ]; then
              clang insert_dylib/main.c -o insert_dylib_tool
              NAME=$(basename "$DYLIB")
              ./insert_dylib_tool --strip-codesig --all-yes "@executable_path/$NAME" Payload/MiApp.app/MiApp Payload/MiApp.app/MiApp_patched 2>/dev/null && mv Payload/MiApp.app/MiApp_patched Payload/MiApp.app/MiApp && chmod +x Payload/MiApp.app/MiApp || true
            fi
          fi
          
          # Crear entitlements
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          # Firmar con ldid
          ldid -S entitlements.plist Payload/MiApp.app/MiApp || ldid -S Payload/MiApp.app/MiApp || codesign --force --deep --sign - Payload/MiApp.app || true
          
          echo "=== Bundle ==="
          ls -la Payload/MiApp.app/
          echo "=== Firmado ==="
          ldid -e Payload/MiApp.app/MiApp 2>/dev/null || codesign -dvv Payload/MiApp.app 2>/dev/null || echo "Verificacion no disponible"
          
          # Crear IPA
          zip -r MiApp.ipa Payload/
          ls -lh MiApp.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-Final
          path: MiApp.ipa
