name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Debug Project
        run: |
          echo "=== Files ==="
          ls -la *.xcodeproj/ 2>/dev/null || echo "No xcodeproj"
          echo ""
          echo "=== xcodeproj contents ==="
          find . -name "*.pbxproj" -exec head -50 {} \; 2>/dev/null
          echo ""
          echo "=== Targets ==="
          plutil -p MiApp.xcodeproj/project.pbxproj 2>/dev/null | grep -i "productType" || true
          echo ""
          echo "=== Available schemes ==="
          ls MiApp.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "No shared schemes"

      - name: Build
        run: |
          xcodebuild build \
            -project MiApp.xcodeproj \
            -target MiApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP=$(find build/DD -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found, showing directory tree:"
            find build/ -type d 2>/dev/null | head -40
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -r "$APP" build/ipa/Payload/
          cd build/ipa && zip -r ../MiApp.ipa Payload/
          echo "IPA: $(ls -lh ../MiApp.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-IPA
          path: build/MiApp.ipa
          retention-days: 30
